<!DOCTYPE html>
<html>
<head>
    <title>Create Alert</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <style>
        .container {
            max-width: 600px;
            margin: 50px auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>Create Alert</h1>
        <a href="/home" class="btn btn-primary">Back</a>
        <form id="createAlertForm">
            <div class="form-group">
                <label for="baseIdSelect">Base Currency:</label>
                <select class="form-control" id="baseIdSelect" required>
                </select>
            </div>
            <div class="form-group">
                <label for="quoteIdSelect">Quote Currency:</label>
                <select class="form-control" id="quoteIdSelect" required>
                </select>
            </div>
            <div class="form-group">
                <label for="alertConditionSelect">Alert Condition:</label>
                <select class="form-control" id="alertConditionSelect" required>
                    <option value=">">Greater than</option>
                    <option value="<">Less than</option>
                </select>
            </div>
            <div class="form-group">
                <label for="alertValueInput">Alert Value:</label>
                <input type="number" class="form-control" id="alertValueInput" required>
            </div>
            <button type="submit" class="btn btn-primary">Create</button>
        </form>
    </div>

    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script>

        if (!localStorage.getItem('token')) {
            window.location.href = '/login';
        }


        var token = localStorage.getItem('token');


        var createAlertForm = document.getElementById('createAlertForm');

        axios.get('http://127.0.0.1:5000/utils/assets')
            .then(function (response) {
                var assets = response.data.assets;
                var baseIdSelect = document.getElementById('baseIdSelect');
                var quoteIdSelect = document.getElementById('quoteIdSelect');

                assets.forEach(function (asset) {
                    var option = document.createElement('option');
                    option.value = asset.id;
                    option.textContent = asset.id;
                    baseIdSelect.appendChild(option);
                });

                assets.forEach(function (asset) {
                    var option = document.createElement('option');
                    option.value = asset.id;
                    option.textContent = asset.id;
                    quoteIdSelect.appendChild(option);
                });
            })
            .catch(function (error) {
                console.error('Error fetching assets:', error);
            });

        createAlertForm.addEventListener('submit', function (event) {
            event.preventDefault();

            var userId = localStorage.getItem('user_id');
            var baseId = document.getElementById('baseIdSelect').value;
            var quoteId = document.getElementById('quoteIdSelect').value;
            var alertCondition = document.getElementById('alertConditionSelect').value;
            var alertValue = document.getElementById('alertValueInput').value;

            var alert = {
                user_id: userId,
                base_id: baseId,
                quote_id: quoteId,
                alert_condition: alertCondition + ' ' + alertValue
            };

            axios.post('http://127.0.0.1:5000/alerts', alert, {
                headers: {
                    'x-access-token': token
                }
            })
            .then(function (response) {
                console.log('Alert created successfully');
                window.location.href = '/home'; 
            })
            .catch(function (error) {
                console.error('Error creating alert:', error);
            });
        });
    </script>
</body>
</html>
