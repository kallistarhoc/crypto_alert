<!DOCTYPE html>
<html>
<head>
    <title>Alert Details</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <style>
        .container {
            max-width: 600px;
            margin: 50px auto;
        }

        .alert-details {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 5px;
        }

        .alert-details h2 {
            margin-top: 0;
        }

        .btn-delete {
            color: #fff;
            background-color: #dc3545;
            border-color: #dc3545;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>Alert Details</h1>  
        <a href="/home" class="btn btn-primary">Back</a>
        <br>
        <br>
        <div class="alert-details" id="alertDetails"></div>
        <div class="text-right">
            <br>
            <button type="button" id="delete-bttn" class="btn btn-danger">Delete</button>
        </div>
    </div>

    <div class="modal fade" id="deleteConfirmationModal" tabindex="-1" role="dialog" aria-labelledby="deleteConfirmationModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteConfirmationModalLabel">Confirm Deletion</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to delete this alert?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-delete" id="confirmDeleteButton">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/jquery/dist/jquery.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script>
        if (!localStorage.getItem('token')) {
            window.location.href = '/login';
        }

        var token = localStorage.getItem('token');

        var urlParams = new URLSearchParams(window.location.search);
        var alertId = urlParams.get('id');

        axios.get('http://127.0.0.1:5000/alerts/' + alertId, {
            headers: {
                'x-access-token': token
            }
        })
        .then(function (response) {
            var alert = response.data.alert;
            var alertDetailsContainer = document.getElementById('alertDetails');

            var alertDetailsHtml = `
                <h2>Alert ID: ${alert.id}</h2>
                <p>User ID: ${alert.user_id}</p>
                <p>Base Currency ID: ${alert.base_id}</p>
                <p>Quote Currency ID: ${alert.quote_id}</p>
                <p>Alert Condition: ${alert.alert_condition}</p>
                <p>Current Rate: 1 ${alert.base_id} = ${alert.current_rate}  ${alert.quote_id}</p>
            `;

            alertDetailsContainer.innerHTML = alertDetailsHtml;
        })
        .catch(function (error) {
            console.error(error);
        });

        var deleteBttn = document.getElementById('delete-bttn');
        deleteBttn.addEventListener('click', function () {
            jQuery('#deleteConfirmationModal').modal('show');
        });

        var confirmDeleteButton = document.getElementById('confirmDeleteButton');
        confirmDeleteButton.addEventListener('click', function() {
            axios.delete('http://127.0.0.1:5000/alerts/' + alertId, {
                headers: {
                    'x-access-token': token
                }
            })
            .then(function (response) {
                console.log('Alert deleted successfully');
            })
            .catch(function (error) {

                console.error('Error deleting alert:', error);
            });
        });
    </script>
</body>
</html>
